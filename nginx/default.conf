server {
	listen 80;
	server_name _;

	root /usr/share/nginx/html;
	index index.htm index.html;

	charset utf-8;

	# .svgz diagrams are gzip-compressed SVG served as-is; tell the browser
	# to transparently decompress instead of trying to parse the raw gzip
	# bytes as XML.
	location ~ \.svgz$ {
		gzip off;
		default_type image/svg+xml;
		add_header Content-Encoding gzip;
		add_header Vary Accept-Encoding;
	}

	location / {
		try_files $uri $uri/ =404;
	}
}
